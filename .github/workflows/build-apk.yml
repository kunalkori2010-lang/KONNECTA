name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android project
        env:
          APP_SERVER_URL: ${{ vars.APP_URL || 'https://ais-pre-uxhhe2pgtrqj3guwpioqx6-922138648142.asia-east1.run.app' }}
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          node -e "
            const fs = require('fs');
            fs.writeFileSync('capacitor.config.json', JSON.stringify({
              appId: 'com.konnecta.app',
              appName: 'KONNECTA',
              webDir: 'dist',
              server: {
                url: process.env.APP_SERVER_URL,
                cleartext: false
              },
              android: {
                allowMixedContent: false
              }
            }, null, 2));
          "
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../KONNECTA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KONNECTA-apk
          path: KONNECTA.apk

      - name: Publish KONNECTA.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KONNECTA Android App
          body: Direct Android APK download for KONNECTA.
          files: KONNECTA.apk
          overwrite_files: true
